services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tourism_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tourism_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_BROKER_ID: "1"
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"

  seed-data:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tourism_db
      DB_SSLMODE: disable
    command: python scripts/seed_railway.py
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  process-data:
    build: .
    command: python scripts/process_data.py
    restart: "no"

  producer:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: tourism_events
    command: python scripts/producer.py
    depends_on:
      - kafka
    restart: unless-stopped

  consumer:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tourism_db
      DB_SSLMODE: disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: tourism_events
    command: python scripts/consumer.py
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      seed-data:
        condition: service_completed_successfully
    restart: unless-stopped

  spark-stream:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: tourism_events
      SPARK_MASTER: local[*]
      SPARK_PACKAGES: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
    command: python scripts/spark_stream.py
    depends_on:
      - kafka
    restart: unless-stopped

  dashboard:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tourism_db
      DB_SSLMODE: disable
    command: streamlit run dashboard/live_dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      seed-data:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data: